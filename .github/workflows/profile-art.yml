name: profile art

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E0465E&color_dots=#141B22,#2B3A44,#4F6772,#8FA6AE,#B7C9CF

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/settings/contrib-3d.json

      - name: Publish to output branch
        run: |
          mkdir -p dist
          cp profile-3d-contrib/profile-ink.svg dist/
          cd dist
          git init -q -b output
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -qm "generate profile art"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" output
